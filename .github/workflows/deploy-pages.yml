name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      demo_only:
        description: 'Deploy Demo-Only Mode (No code execution)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend for Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Backend Configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          DEMO_ONLY: ${{ github.event.inputs.demo_only }}
        run: |
          if [ "$DEMO_ONLY" = "true" ]; then
            echo "Deploying in Demo-Only mode. Code execution will be disabled."
            exit 0
          fi
          
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is missing. Please set it in Settings -> Secrets and variables -> Actions -> Variables."
            echo "::error::It must be the full HTTPS URL of your deployed backend ending in /api"
            exit 1
          fi
          
          if [[ "$VITE_API_BASE_URL" == http://* ]]; then
            echo "::error::VITE_API_BASE_URL must use HTTPS, not HTTP. Mixed content will be blocked by browsers."
            exit 1
          fi
          
          if [[ "$VITE_API_BASE_URL" == *github.io* ]]; then
            echo "::error::VITE_API_BASE_URL cannot point to GitHub Pages. GitHub Pages only hosts the frontend."
            exit 1
          fi
          
          echo "Backend URL configured: $VITE_API_BASE_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify backend URL, health and CORS
        if: ${{ github.event.inputs.demo_only != 'true' }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node scripts/check-backend.mjs || echo "Backend check skipped or failed, proceeding with build anyway..."
        working-directory: .

      - name: Build production app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
