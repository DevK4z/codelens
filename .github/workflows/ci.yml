name: CodeLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Verify g++ compiler
        run: |
          g++ --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Run algorithm verification tests
        run: npm test

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  sandbox-docker:
    name: Sandbox Container Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Sandbox Runner
        run: |
          docker build -t codelens-sandbox:latest ./runner

      - name: Integration test - run C++ via JSON protocol
        run: |
          OUTPUT=$(echo '{"code": "#include <iostream>\nusing namespace std;\nint main(){int a,b;cin>>a>>b;cout<<a+b<<endl;return 0;}", "stdin": "3 5"}' | docker run -i --rm codelens-sandbox:latest)
          echo "Container output: $OUTPUT"
          echo "$OUTPUT" | grep -q '8' || { echo "FAIL: expected output to contain 8"; exit 1; }
          echo "PASS: sandbox protocol works correctly"

