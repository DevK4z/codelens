name: CodeLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Verify g++ compiler
        run: |
          g++ --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Run algorithm verification tests
        run: npm test

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and verify all exercise references
        run: python3 ../scripts/check-exercise-samples.py

      - name: Test saved code persistence
        run: npm test

      - name: Build frontend
        run: npm run build

  sandbox-docker:
    name: Sandbox Container Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Sandbox Runner
        run: |
          docker build -t codelens-sandbox:latest ./runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend test dependencies
        run: npm ci --prefix backend

      - name: Test native C++ and API through the production DockerRunner
        run: npm --prefix backend run test:native
        env:
          TEST_DOCKER: '1'

      - name: Test GCC/GDB source visualization through Docker and API
        run: npm --prefix backend run test:debugger
        env:
          TEST_DOCKER: '1'

      - name: Verify Windows CRLF build context can execute the entrypoint
        run: |
          cp -R backend/sandbox /tmp/codelens-crlf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/codelens-crlf/run.sh')
          p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'))
          PY
          docker build -t codelens-sandbox-crlf /tmp/codelens-crlf
          docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /sandbox:rw,exec,nosuid,size=128m,mode=1777 --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 codelens-sandbox-crlf <<'JSON' > /tmp/codelens-crlf-result.json
          {"code":"#include <iostream>\nint main(){std::cout << \"ok\";}", "stdin":"", "debugTrace":true}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/codelens-crlf-result.json').read_text())
          assert result['codelensDebugger'] == 1, result
          assert result['exitCode'] == 0, result
          assert result['stdout'] == 'ok', result
          assert len(result['trace']) > 0, result
          PY

      - name: Verify alternate sandbox build context stays identical
        run: |
          diff runner/Dockerfile backend/sandbox/Dockerfile
          diff runner/run.sh backend/sandbox/run.sh
          diff runner/gdb_trace.py backend/sandbox/gdb_trace.py
          diff runner/debug_result.py backend/sandbox/debug_result.py

  render-image:
    name: Render Image Sandbox Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Render backend image
        run: docker build -f backend/Dockerfile -t codelens-render .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend test dependencies
        run: npm ci --prefix backend

      # Exactly the capability bounding set Render grants (read from /proc/self/status on Render:
      # 0x400cb). Notably no CAP_KILL, so root cannot signal a run's uid. No --privileged or --init.
      - name: Start the image with Render's capabilities
        run: |
          caps='--cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID --cap-add SETUID --cap-add SYS_CHROOT'
          docker run -d --name codelens-render -p 10000:10000 --memory 512m $caps codelens-render
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:10000/api/v1/health && exit 0; sleep 1; done
          curl -sS http://127.0.0.1:10000/api/v1/health || true
          docker logs codelens-render
          exit 1

      - name: Verify execution and isolation inside the jail
        run: npm --prefix backend run test:render
        env:
          SANDBOX_API_URL: http://127.0.0.1:10000
