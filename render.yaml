# Render Blueprint for the CodeLens API (Render dashboard: New > Blueprint > this repository).
# The frontend stays on GitHub Pages: set the repository variable VITE_API_BASE_URL to
# https://<service>.onrender.com/api once Render shows the service URL.
services:
  - type: web
    name: codelens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Free: 0.1 CPU and 512 MB, sleeps after 15 idle minutes (about a minute to wake).
    # Measured at 0.1 CPU: step-by-step visualization takes 5-11s the first time, 4-7s when only
    # the input changes (the compiled program is reused) and is instant for an identical rerun.
    # starter (0.5 CPU) brings both to 1-2.5s; then RUN_TIMEOUT_MS can go back to 5000.
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - backend/**
        - runner/**
        - .dockerignore
        - render.yaml
    envVars:
      - key: CORS_ORIGINS
        value: https://devk4z.github.io
      # GDB stepping on 0.1 CPU needs more than the default 5s (run.sh allows up to 20s).
      - key: RUN_TIMEOUT_MS
        value: "20000"
      # 512 MB holds one compiler at a time safely; others wait in the queue.
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_QUEUED_RUNS
        value: "8"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
